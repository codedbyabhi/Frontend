<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Navbar Replica</title>
    <link rel="stylesheet" href="../node_modules/bootstrap/font/bootstrap-icons.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #ffffff;
        }

        .navbar {
            height: 60px;
            width: 100%;
            background-color: #0b0d0e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 27px;
            position: relative;
            color: #adb5bd;
        }

        .left-section {
            display: flex;
            align-items: center;
            gap: 22px;
            z-index: 2;
        }

        .logo {
            width: 35px;
            height: 35px;
            background-color: #712cf9;
            color: white;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            font-weight: bold;
            position: relative;
        }

        .logo::after {
            content: "";
            position: absolute;
            width: 9px;
            height: 8px;
            background-color: #712cf9;
            bottom: -3px;
            right: 0;
            transform: skewY(25deg);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links a {
            color: #adb5bd;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #ffffff;
        }

        .search-box {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 280px;
            height: 36px;
            border: 1px solid #343a40;
            border-radius: 11px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 10px;
            background-color: #101214;
        }

        .search-icon {
            width: 15px;
            height: 15px;
            border: 1.5px solid #7b858e;
            border-radius: 50%;
            position: relative;
            flex-shrink: 0;
        }

        .search-icon::after {
            content: "";
            position: absolute;
            width: 6px;
            height: 1.5px;
            background: #7b858e;
            right: -5px;
            bottom: -3px;
            transform: rotate(48deg);
        }

        .search-text {
            color: #7b858e;
            font-size: 14px;
            flex: 1;
        }

        .shortcut {
            color: #9ba3aa;
            border: 1px solid #343a40;
            border-radius: 5px;
            padding: 2px 6px;
            font-size: 11px;
        }

        .right-section {
            display: flex;
            align-items: center;
            gap: 17px;
            z-index: 2;
        }

        .github {
            width: 17px;
            height: 17px;
            fill: #adb5bd;
        }

        .version {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
            color: #adb5bd;
            cursor: pointer;
        }

        .arrows {
            font-size: 12px;
            color: #7b858e;
        }

        .theme {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .theme-circle {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 1.5px solid #adb5bd;
            background: linear-gradient(to right, #adb5bd 50%, transparent 50%);
        }

        .theme-arrows {
            color: #7b858e;
            font-size: 12px;
        }

        @media (max-width: 700px) {
            .navbar {
                padding: 0 15px;
            }

            .left-section {
                gap: 14px;
            }

            .nav-links {
                gap: 12px;
            }

            .nav-links a {
                font-size: 12px;
            }

            .search-box {
                display: none;
            }

            .right-section {
                gap: 10px;
            }
        }

        @media (max-width: 450px) {
            .nav-links a:nth-child(n+3) {
                display: none;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="left-section">

            <div class="logo">B</div>

            <div class="nav-links">
                <a href="#">Docs</a>
                <a href="#">Examples</a>
                <a href="#">Icons</a>
                <a href="#">Blog</a>
            </div>

        </div>

        <div class="search-box">
            <span class="search-icon"></span>
            <span class="search-text">Search docs...</span>
            <span class="shortcut">Ctrl K</span>
        </div>

        <div class="right-section">

            <svg class="github" viewBox="0 0 24 24">
                <path d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.55.1.76-.24.76-.53v-2.08c-3.1.68-3.75-1.32-3.75-1.32-.5-1.29-1.23-1.63-1.23-1.63-1.01-.69.08-.68.08-.68 1.12.08 1.71 1.15 1.71 1.15 1 .1.75 2.37 3.67 1.76.1-.72.39-1.2.7-1.48-2.48-.28-5.08-1.24-5.08-5.52 0-1.22.44-2.21 1.15-2.99-.12-.28-.5-1.42.11-2.96 0 0 .94-.3 3.05 1.14a10.6 10.6 0 0 1 5.55 0c2.11-1.44 3.05-1.14 3.05-1.14.61 1.54.23 2.68.11 2.96.72.78 1.15 1.77 1.15 2.99 0 4.29-2.6 5.23-5.09 5.51.4.35.75 1.03.75 2.08V22c0 .29.2.63.76.52A11.1 11.1 0 0 0 12 .9z"/>
            </svg>

            <div class="version">
                v6.0
                <span class="arrows">⌃⌄</span>
            </div>

            <div class="theme">
                <div class="theme-circle"></div>
                <span class="theme-arrows">⌃⌄</span>
            </div>

        </div>

    </nav>

</body>
</html>
